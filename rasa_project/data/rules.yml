version: "3.1"

rules:
  - rule: Say hi
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Acknowledge thanks
    steps:
      - intent: thank
      - action: utter_thank_you

  - rule: Activate trip intake form
    steps:
      - intent: start_trip_planning
      - action: trip_intake_form
      - active_loop: trip_intake_form

  - rule: Submit trip intake form
    condition:
      - active_loop: trip_intake_form
    steps:
      - action: trip_intake_form
      - active_loop: null
      - action: action_trip_intake_submit

  # --- Direct information requests (can be asked any time once a
  # destination is known, not only inside the intake form) ---

  - rule: Answer hotel request
    steps:
      - intent: ask_hotels
      - action: action_find_hotels

  - rule: Answer transport request
    steps:
      - intent: ask_transport
      - action: action_find_transport

  - rule: Answer attractions request
    steps:
      - intent: ask_attractions
      - action: action_find_attractions

  - rule: Answer weather request
    steps:
      - intent: ask_weather
      - action: action_weather_forecast

  - rule: Answer carbon footprint request
    steps:
      - intent: ask_carbon_footprint
      - action: action_estimate_carbon

  - rule: Answer place description request
    steps:
      - intent: ask_place_description
      - action: action_describe_place


  - rule: Direct request for a human advisor
    steps:
      - intent: request_human_handover
      - action: action_human_handover

  - rule: Fallback on low NLU confidence
    steps:
      - intent: nlu_fallback
      - action: action_default_fallback
