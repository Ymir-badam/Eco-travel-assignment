
services:
  web:
    build: .
    env_file: .env
    ports:
      - "7860:7860"
    volumes:
      - eco_data:/app/data       
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:7860/chatbot/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  eco_data: